openapi: 3.1.0
info:
  version: '1.0'
  title: User-API
  summary: '유저용 API '
  description: '유저용 API 목록 '
  termsOfService: ''
  contact:
    name: Admin
    url: 'http://localhost:8080'
    email: all-climb@gmail.com
  license:
    url: 'https://all-climb.com'
    name: all-climb
servers:
  - url: 'http://localhost:8080/api'
    description: 'local '
  - url: 'https://all-climb.com/api'
    description: dev
components:
  schemas:
    Ticket:
      title: Ticket
      x-stoplight:
        id: zphirw5mil2xh
      type: object
      properties:
        id:
          type: integer
          x-stoplight:
            id: i9gmqolkubbps
        ticketType:
          x-stoplight:
            id: j1m7ouk4dtm7o
          enum:
            - PT
            - CT
          description: |-
            이용권 타입 
            - PT : 기간권
            - CT : 횟수권
        name:
          type: string
          x-stoplight:
            id: ystryxscq55k0
          description: 이용권 이름
        price:
          type: number
          x-stoplight:
            id: szu9i9icdfb4h
          description: 가격
        minUseGrade:
          type: integer
          x-stoplight:
            id: qa2wtyyylsyzp
          description: 최소이용암장등급
        maxUseGrade:
          type: integer
          x-stoplight:
            id: ut5wkhhwd3zy5
          description: 최대이용암장등급
        ticketCount:
          type: integer
          x-stoplight:
            id: rav3a75thz1ki
          description: 이용가능횟수
        validityDay:
          type: integer
          x-stoplight:
            id: fb50sadd07n4u
          description: 이용가능일수
      x-tags:
        - Tickets
      description: ''
paths:
  /v1/tickets:
    get:
      summary: 이용권 목록 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    x-stoplight:
                      id: em9je0p79nyox
                  message:
                    type: string
                    x-stoplight:
                      id: p00pfr4vjuivm
                  data:
                    type: array
                    x-stoplight:
                      id: iklo4zf4nddbg
                    items:
                      type: object
                      $ref: '#/components/schemas/Ticket'
                      x-stoplight:
                        id: 4xqvdqw5ipigl
              examples:
                Example 1:
                  value:
                    code: common.success.00001
                    message: Success
                    data:
                      - id: 1
                        ticketType: PT
                        name: 1달 기간권
                        price: 200000
                        minUseGrade: 0
                        maxUseGrade: 10
                        ticketCount: -1
                        validityDay: 30
                      - id: 2
                        ticketType: CT
                        name: 일일입장권
                        price: 22000
                        minUseGrade: 0
                        maxUseGrade: 10
                        ticketCount: 1
                        validityDay: 1
      operationId: get-v1-tickets
      x-stoplight:
        id: btef211f5n6br
      parameters:
        - schema:
            type: string
            enum:
              - PT
              - CT
          in: query
          name: ticketTypeCode
          description: '티켓타입(PT : 기간권, CT : 횟수권)'
      tags:
        - Tickets
      description: '이용권 목록 조회 '
  '/v1/tickets/{ticketId}':
    parameters:
      - schema:
          type: string
        name: ticketId
        in: path
        required: true
        description: 이용권ID
    get:
      summary: 이용권 상세 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    x-stoplight:
                      id: wb4j2fisirl0p
                  message:
                    type: string
                    x-stoplight:
                      id: 5bbsnk0z3a0dp
                  data:
                    $ref: '#/components/schemas/Ticket'
                    x-stoplight:
                      id: ettggnk97fu8a
      operationId: get-v1-tickets-ticketId
      x-stoplight:
        id: bas3hzhrjg6ku
      tags:
        - Tickets
      description: '이용권 상세 조회 '
tags:
  - name: User-API
